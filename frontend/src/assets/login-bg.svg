    <circle cx="1270" cy="260" r="23" fill="url(#green)" opacity="0.95"/>
    <path d="M1258 260 L1267 269 L1284 247" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
