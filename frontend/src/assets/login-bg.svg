<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#F6F8FB"/>
  <defs>
    <linearGradient id="bg" x1="172" y1="42" x2="1620" y2="1052" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9F7F4"/>
      <stop offset="0.52" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EAF1FF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#F7FBFC" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#42D392"/>
      <stop offset="1" stop-color="#0F766E"/>
