  <path d="M422 820 C648 700 822 850 1026 760 C1248 662 1364 770 1608 650" stroke="#9DB7C0" stroke-opacity="0.22" stroke-width="2"/>

  <g filter="url(#shadow)" opacity="0.92">
    <rect x="232" y="220" width="436" height="260" rx="18" fill="url(#card)" stroke="#DCE7EB"/>
    <rect x="264" y="258" width="116" height="12" rx="6" fill="#0F766E" opacity="0.42"/>
    <text x="264" y="309" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#0F766E" opacity="0.72">+ if (riskScore &gt;= gate) &#123;</text>
    <text x="286" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#2563EB" opacity="0.66">review.approve();</text>
    <text x="286" y="387" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#6B7F87" opacity="0.58">return patch.suggest();</text>
    <text x="264" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#B42318" opacity="0.54">- unsafeMutation();</text>
    <path d="M540 370 L580 410 L646 318" stroke="url(#green)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

