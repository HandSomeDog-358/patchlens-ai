    <rect x="1220" y="742" width="108" height="12" rx="6" fill="#2563EB" opacity="0.36"/>
    <text x="1220" y="800" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#2563EB" opacity="0.66">const diff = await loadCommit();</text>
    <text x="1258" y="838" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#0F766E" opacity="0.68">assert(noRaceCondition);</text>
    <text x="1258" y="876" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#6B7F87" opacity="0.6">findings.map(toComment);</text>
    <path d="M1228 826 L1240 838 L1262 810" stroke="#0F766E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1228 862 L1240 874 L1262 846" stroke="#0F766E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g opacity="0.84">
