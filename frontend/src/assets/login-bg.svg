    <path d="M798 185 L779 198 L798 211" stroke="#0F766E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M814 211 L833 198 L814 185" stroke="#2563EB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g opacity="0.52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">
    <text x="318" y="676" font-size="72" fill="#0F766E">&lt;/&gt;</text>
    <text x="1456" y="560" font-size="88" fill="#2563EB">&#123; &#125;</text>
    <text x="868" y="318" font-size="34" fill="#6B7F87">git diff --check</text>
    <text x="740" y="746" font-size="32" fill="#0F766E">review.status === "PASSED"</text>
    <text x="1018" y="226" font-size="30" fill="#2563EB">scan(files).filter(risk)</text>
  </g>

  <g opacity="0.72">
    <rect x="936" y="830" width="94" height="94" rx="24" fill="#FFFFFF" stroke="#DCE7EB"/>
    <path d="M962 878 L978 894 L1007 856" stroke="url(#green)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

