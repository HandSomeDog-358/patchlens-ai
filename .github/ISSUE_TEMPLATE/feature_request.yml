name: Feature request
description: Suggest an improvement for PatchLens AI.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or pain point should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should PatchLens AI do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Review engine
        - Platform integration
        - Model configuration
        - Quality policy
        - Security
        - UI
        - Documentation
        - Other
